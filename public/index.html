<!DOCTYPE html>
<html>
<head>

<title>Office Spotify Skip</title>

<style>

body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow:hidden;
}

/* blurred background */

#bg{
position:fixed;
width:100%;
height:100%;
background-size:cover;
background-position:center;
filter:blur(60px) brightness(0.4);
transform:scale(1.2);
z-index:-1;
}

/* layout */

.layout{display:flex;}

.side-panel{
width:260px;
background:rgba(0,0,0,0.6);
padding:20px;
height:100vh;
}

.container{
flex:1;
text-align:center;
padding-top:80px;
}

#albumCover{
width:260px;
border-radius:15px;
}

/* progress */

.progress-container{
background:rgba(255,255,255,0.2);
height:10px;
border-radius:10px;
width:320px;
margin:15px auto;
}

#progressBar{
height:100%;
width:0%;
background:#1DB954;
border-radius:10px;
}

/* SKIP BUTTON */

#skipBtn{

background:#1DB954;
border:none;
padding:18px 55px;
border-radius:60px;
font-size:22px;
font-weight:bold;
color:white;
cursor:pointer;
margin-top:20px;

box-shadow:0 0 15px rgba(29,185,84,0.6);

transition:all .2s;

}

#skipBtn:hover{

transform:scale(1.08);

box-shadow:0 0 25px rgba(29,185,84,0.9);

}
/* WEATHER WIDGET */

#weatherWidget{

position:fixed;
top:20px;
left:360px;

background:rgba(0,0,0,0.25);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

padding:14px;
border-radius:12px;

font-size:14px;
width:170px;
border:1px solid rgba(255,255,255,0.08);
}

#weatherCity{
font-weight:bold;
margin-bottom:6px;
}

#weatherForecast{
margin-top:6px;
font-size:12px;
opacity:0.9;
}


/* CURRENCY WIDGET */

#currencyWidget{

position:fixed;
bottom:20px;
left:360px;

background:rgba(0,0,0,0.25);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

padding:14px;
border-radius:12px;

font-size:13px;
width:170px;
border:1px solid rgba(255,255,255,0.08);
}

.currencyTitle{
font-weight:bold;
margin-bottom:6px;
}
/* HOLIDAY CALENDAR */

#calendarWidget{
position:fixed;
bottom:20px;
left:590px;
background:rgba(0,0,0,0.65);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
padding:12px;
border-radius:12px;
font-size:12px;
width:210px;
border:1px solid rgba(255,255,255,0.1);
color:white;
z-index:5;
}

.cal-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:8px;
}

.cal-nav{
background:none;
border:none;
color:rgba(255,255,255,0.6);
cursor:pointer;
font-size:14px;
padding:0 4px;
line-height:1;
}

.cal-nav:hover{ color:white; }

.cal-month-label{
font-weight:bold;
font-size:12px;
letter-spacing:0.5px;
}

.cal-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:2px;
}

.cal-day-header{
text-align:center;
font-size:9px;
color:rgba(255,255,255,0.4);
padding:2px 0;
font-weight:bold;
}

.cal-day{
text-align:center;
padding:3px 0;
border-radius:4px;
position:relative;
font-size:11px;
cursor:default;
line-height:1.4;
}

.cal-day.other-month{ color:rgba(255,255,255,0.2); }

.cal-day.today{
background:rgba(29,185,84,0.25);
color:#1DB954;
font-weight:bold;
border-radius:50%;
}

.cal-day.has-holiday{ cursor:pointer; }

.cal-day.has-holiday::after{
content:'';
display:block;
width:4px;
height:4px;
border-radius:50%;
background:#ffd700;
margin:0 auto;
margin-top:1px;
}

.cal-day.has-holiday:hover{
background:rgba(255,215,0,0.15);
border-radius:4px;
}

.cal-tooltip{
position:fixed;
background:rgba(0,0,0,0.92);
border:1px solid rgba(255,255,255,0.15);
border-radius:8px;
padding:8px 12px;
font-size:11px;
color:white;
z-index:9999;
pointer-events:none;
display:none;
max-width:220px;
line-height:1.7;
box-shadow:0 4px 20px rgba(0,0,0,0.5);
}

.cal-tooltip-name{
font-weight:bold;
color:#ffd700;
margin-bottom:4px;
font-size:12px;
}

/* admin */

#adminBtn{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
border-radius:50%;
background:#1DB954;
border:none;
font-size:20px;
cursor:pointer;
}

#adminPanel{
position:fixed;
bottom:90px;
right:20px;
background:#181818;
padding:15px;
border-radius:10px;
display:none;
width:220px;
}

.switch{
width:50px;
height:24px;
background:red;
border-radius:12px;
position:relative;
cursor:pointer;
}

.switch::after{
content:"";
width:20px;
height:20px;
background:white;
border-radius:50%;
position:absolute;
top:2px;
left:2px;
transition:transform .3s;
}

.switch.on{background:#1DB954;}
.switch.on::after{transform:translateX(26px);}

.switch-row{
display:flex;
justify-content:space-between;
align-items:center;
margin:8px 0;
}

#adminMessage{
margin-top:10px;
font-size:13px;
color:#1DB954;
}

/* GIFS */

#cornerGif{
position:fixed;
bottom:20px;
left:20px;
width:140px;
pointer-events:none;
z-index:5;
opacity:.9;
}

#topRightGif{
position:fixed;
top:20px;
right:20px;
width:120px;
pointer-events:none;
z-index:5;
opacity:.95;
}
  
</style>
</head>

<body>

<div id="bg"></div>

<div id="weatherWidget">

<div id="weatherCity"></div>
<div id="weatherNow"></div>
<div id="weatherForecast"></div>

</div>

<div id="currencyWidget">

<div class="currencyTitle">EUR Rates</div>
<div id="currencyRates">Loading...</div>

</div>

<!-- HOLIDAY CALENDAR -->
<div id="calendarWidget">
  <div class="cal-header">
    <button class="cal-nav" onclick="calNavigate(-1)">◀</button>
    <span class="cal-month-label" id="calMonthLabel"></span>
    <button class="cal-nav" onclick="calNavigate(1)">▶</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>
<div class="cal-tooltip" id="calTooltip"></div>
  
<img id="cornerGif" src="/dancer.gif">
<img id="topRightGif" src="/penguin.gif">

<div class="layout">

<div class="side-panel">
<h3>Last Skip</h3>
<div id="lastSkipPanel">No skips yet</div>
</div>

<div class="container">

<img id="albumCover">

<h2 id="songTitle">Loading...</h2>

<div id="artistName"></div>

<div class="progress-container">
<div id="progressBar"></div>
</div>

<div id="voteCounter">0 / 0 votes</div>

<button id="skipBtn" onclick="vote()">SKIP</button>

<ul id="voters"></ul>

</div>
</div>

<button id="adminBtn" onclick="toggleAdminPanel()">⚙</button>

<!-- ADMIN PANEL -->

<div id="adminPanel">

<div id="loginSection">

<input type="password" id="adminPasswordInput" placeholder="Admin password">
<button onclick="adminLogin()">Login</button>

</div>

<div id="adminControls" style="display:none">

<input id="totalInput" type="number" placeholder="People">
<button onclick="setTotal()">Set People</button>

<div class="switch-row">
<span>Voting</span>
<div id="votingSwitch" class="switch" onclick="toggleVoting()"></div>
</div>

<div class="switch-row">
<span>Ping Sound</span>
<div id="soundSwitch" class="switch" onclick="toggleSound()"></div>
</div>

<h4>Connected Users</h4>
<ul id="userList"></ul>

<h4>Ban User</h4>

<input id="banName" placeholder="Name">

<button onclick="banUser()">Ban</button>
<button onclick="clearVotes()">Clear Votes</button>

<div id="adminMessage"></div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io();

const pingSound=new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

let userId=localStorage.getItem("userId");
let userName=localStorage.getItem("userName");
let lastCount=0;

if(!userId){
userId=crypto.randomUUID();
localStorage.setItem("userId",userId);
}

if(!userName){
userName=prompt("Enter your name:");
localStorage.setItem("userName",userName);
}

socket.on("voteUpdate",data=>updateUI(data));
socket.emit("registerUser", {userId, name:userName});

function vote(){

fetch("/vote",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId,name:userName})
})
.then(res=>res.json())
.then(updateUI);

}

function updateUI(data){

if(data.count>lastCount && data.soundEnabled){
pingSound.play().catch(()=>{});
}

lastCount=data.count;

document.getElementById("voteCounter").innerText =
data.count+" / "+data.needed+" votes";

const percent=data.needed>0?(data.count/data.needed)*100:0;

document.getElementById("progressBar").style.width =
Math.min(percent,100)+"%";

const list=document.getElementById("voters");
list.innerHTML="";

data.voters.forEach(v=>{
const li=document.createElement("li");
li.innerText=v;
list.appendChild(li);
});

updateSwitch("votingSwitch",data.votingEnabled);
updateSwitch("soundSwitch",data.soundEnabled);

if(data.message){
document.getElementById("adminMessage").innerText=data.message;
}

/* CONNECTED USERS */

if(data.users){
const list=document.getElementById("userList");
list.innerHTML="";
data.users.forEach(u=>{
const li=document.createElement("li");
li.innerText=u;
list.appendChild(li);
});
}

}

function loadWeather(){

fetch("/weather")
.then(res=>res.json())
.then(data=>{

document.getElementById("weatherCity").innerText=data.city;

document.getElementById("weatherNow").innerHTML=
`
<div>${data.temp}°C</div>
<div>Wind ${data.wind} km/h</div>
<div>Rain ${data.rain}%</div>
`;

const f=document.getElementById("weatherForecast");
f.innerHTML="";

data.forecast.forEach(d=>{

const date=new Date(d.date);
const day=date.toLocaleDateString("en-US",{weekday:"short"});

const line=document.createElement("div");
line.innerText=day+" "+d.temp+"°C";

f.appendChild(line);

});

});

}

function loadCurrency(){

fetch("/currency")
.then(res=>res.json())
.then(data=>{

if(!data) return;

document.getElementById("currencyRates").innerHTML=`

GB GBP → ${data.GBP ?? "-"}<br>
US USD → ${data.USD ?? "-"}<br>
PL PLN → ${data.PLN ?? "-"}<br>
SE SEK → ${data.SEK ?? "-"}<br>
NO NOK → ${data.NOK ?? "-"}<br>
DK DKK → ${data.DKK ?? "-"}

`;

});

}

function applyAlbumColor(imageUrl){

const img=new Image();
img.crossOrigin="anonymous";
img.src=imageUrl;

img.onload=function(){

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;

let r=0,g=0,b=0,count=0;

for(let i=0;i<data.length;i+=40){

r+=data[i];
g+=data[i+1];
b+=data[i+2];
count++;

}

r=Math.floor(r/count);
g=Math.floor(g/count);
b=Math.floor(b/count);

const color=`rgb(${r},${g},${b})`;

document.getElementById("weatherWidget").style.boxShadow=`0 0 20px ${color}`;
document.getElementById("currencyWidget").style.boxShadow=`0 0 20px ${color}`;

};

}

function updateSwitch(id,state){
const el=document.getElementById(id);
state?el.classList.add("on"):el.classList.remove("on");
}

function loadVotes(){
fetch("/votes").then(res=>res.json()).then(updateUI);
}

function loadSong(){

fetch("/current-song")
.then(res=>res.json())
.then(data=>{

if(!data.title)return;

const parts=data.title.split(" - ");

document.getElementById("songTitle").innerText=parts[0];
document.getElementById("artistName").innerText=parts[1]||"";

if(data.image){
document.getElementById("albumCover").src=data.image;
  applyAlbumColor(data.image);
document.getElementById("bg").style.backgroundImage=`url(${data.image})`;
}

loadVotes();

});

}

function loadLastSkip(){

fetch("/last-skip")
.then(res=>res.json())
.then(data=>{

const panel=document.getElementById("lastSkipPanel");

if(!data){
panel.innerHTML="No skips yet";
return;
}

panel.innerHTML=`
<p><strong>Song:</strong><br>${data.song}</p>
<p><strong>Skipped By:</strong></p>
<ul>${data.skippedBy.map(n=>`<li>${n}</li>`).join("")}</ul>
<p><strong>Time:</strong><br>${data.time}</p>
`;

});

}

function toggleAdminPanel(){
const panel=document.getElementById("adminPanel");
panel.style.display=panel.style.display==="none"?"block":"none";
}

function adminLogin(){

const password=document.getElementById("adminPasswordInput").value;

fetch("/admin-auth",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({password})
})
.then(res=>{
if(res.status===403){alert("Wrong password");return;}
document.getElementById("loginSection").style.display="none";
document.getElementById("adminControls").style.display="block";
});

}

function setTotal(){

const total=document.getElementById("totalInput").value;
const password=document.getElementById("adminPasswordInput").value;

fetch("/set-total",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({total,password})
});

}

function toggleVoting(){

const password=document.getElementById("adminPasswordInput").value;

fetch("/toggle-voting",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({password})
});

}

function toggleSound(){

const password=document.getElementById("adminPasswordInput").value;

fetch("/toggle-sound",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({password})
});

}

function banUser(){

const name=document.getElementById("banName").value;
const password=document.getElementById("adminPasswordInput").value;

fetch("/ban-user",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,password})
});

}

function clearVotes(){

const password=document.getElementById("adminPasswordInput").value;

fetch("/clear-votes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({password})
});

}

/* ---------------- HOLIDAY CALENDAR ---------------- */

const CAL_COUNTRIES = {
  FI:'🇫🇮 Finland', EE:'🇪🇪 Estonia', LV:'🇱🇻 Latvia',
  LT:'🇱🇹 Lithuania', PL:'🇵🇱 Poland', NL:'🇳🇱 Netherlands',
  DE:'🇩🇪 Germany', BE:'🇧🇪 Belgium', GB:'🇬🇧 UK',
  IE:'🇮🇪 Ireland', ES:'🇪🇸 Spain', PT:'🇵🇹 Portugal',
  DK:'🇩🇰 Denmark', NO:'🇳🇴 Norway', SE:'🇸🇪 Sweden'
};

function getEaster(year) {
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}

function getMidsummerSat(year) {
  const d=new Date(year,5,20);
  while(d.getDay()!==6) d.setDate(d.getDate()+1);
  return d;
}

function buildHolidays(year) {
  const easter=getEaster(year);
  const em=easter.getTime(), day=86400000;
  function ep(n){ const d=new Date(em+n*day); return pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function pad(n){ return n.toString().padStart(2,'0'); }
  function fmt(d){ return pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  const ms=getMidsummerSat(year);
  const mse=new Date(ms.getTime()-day);
  const h={};
  function add(mmdd,name,countries){ if(!h[mmdd])h[mmdd]=[]; h[mmdd].push({name,countries}); }

  add('01-01',"New Year's Day",['FI','EE','LV','LT','PL','NL','DE','BE','GB','IE','ES','PT','DK','NO','SE']);
  add('01-06','Epiphany',['FI','LT','PL','ES','PT']);
  add('02-16','Restoration of Independence',['LT']);
  add('02-24','Independence Day',['EE']);
  add('03-11','Restoration of Independence',['LT']);
  add(ep(-2),'Good Friday',['FI','EE','DE','NL','BE','GB','IE','DK','NO','SE']);
  add(ep(0),'Easter Sunday',['EE','LV','LT','PL','NL','DE','BE','IE','ES','PT','DK','SE']);
  add(ep(1),'Easter Monday',['FI','EE','LV','LT','PL','NL','DE','BE','GB','IE','ES','DK','NO','SE']);
  add(ep(39),'Ascension Day',['FI','EE','NL','DE','BE','NO','DK','SE']);
  add(ep(49),'Whit Sunday (Pentecost)',['EE','LV','NL','DE','NO','DK','SE']);
  add(ep(50),'Whit Monday',['FI','EE','LT','NL','DE','BE','DK','IE']);
  add('05-01','Labour Day / May Day',['FI','EE','LV','LT','PL','NL','DE','BE','ES','PT','DK','NO','SE']);
  add('05-04','Restoration of Independence',['LV']);
  add('05-05','Liberation Day',['NL']);
  add('05-17','Constitution Day',['NO']);
  add('06-05','Constitution Day',['DK']);
  add('06-06','National Day',['SE']);
  add(fmt(mse),'Midsummer Eve',['FI']);
  add(fmt(ms),'Midsummer Day',['FI','SE']);
  add('06-23','Midsummer Eve (Ligo) / Victory Day',['LV','EE','LT']);
  add('06-24',"Midsummer (Jāņi) / St. John's Day",['LV','LT']);
  add('08-15','Assumption of Mary',['BE','ES','PT','IE']);
  add('08-20','Restoration of Independence',['EE']);
  add('10-03','German Unity Day',['DE']);
  add('11-01',"All Saints' Day",['PL','ES','PT','BE','LT']);
  add('11-11','Independence Day / Armistice Day',['PL','BE']);
  add('11-18','Proclamation of Independence',['LV']);
  add('12-06','Independence Day',['FI']);
  add('12-08','Immaculate Conception',['ES','PT','IE']);
  add('12-24','Christmas Eve',['FI','EE','LV','LT','DE','DK','NO','SE']);
  add('12-25','Christmas Day',['FI','EE','LV','LT','PL','NL','DE','BE','GB','IE','ES','PT','DK','NO','SE']);
  add('12-26',"Boxing Day / St. Stephen's Day",['FI','EE','LV','LT','PL','NL','DE','BE','GB','IE','DK','NO','SE']);
  add('12-31',"New Year's Eve",['LV','DE']);
  return h;
}

let calYear=new Date().getFullYear(), calMonth=new Date().getMonth(), holidayCache={};
function getHolidays(y){ if(!holidayCache[y])holidayCache[y]=buildHolidays(y); return holidayCache[y]; }

function renderCalendar() {
  const today=new Date(), holidays=getHolidays(calYear);
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonthLabel').innerText=months[calMonth]+' '+calYear;
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d=>{ const h=document.createElement('div'); h.className='cal-day-header'; h.innerText=d; grid.appendChild(h); });
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const startOffset=(firstDay===0?6:firstDay-1);
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  for(let i=0;i<startOffset;i++){ const d=document.createElement('div'); d.className='cal-day other-month'; d.innerText=daysInPrev-startOffset+1+i; grid.appendChild(d); }
  for(let day=1;day<=daysInMonth;day++){
    const d=document.createElement('div'); d.className='cal-day'; d.innerText=day;
    const mmdd=(calMonth+1).toString().padStart(2,'0')+'-'+day.toString().padStart(2,'0');
    const dh=holidays[mmdd];
    if(today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===day) d.classList.add('today');
    if(dh&&dh.length>0){
      d.classList.add('has-holiday');
      d.addEventListener('mouseenter',e=>showCalTooltip(e,dh));
      d.addEventListener('mouseleave',hideCalTooltip);
      d.addEventListener('mousemove',moveCalTooltip);
    }
    grid.appendChild(d);
  }
  const remaining=(startOffset+daysInMonth)%7===0?0:7-((startOffset+daysInMonth)%7);
  for(let i=1;i<=remaining;i++){ const d=document.createElement('div'); d.className='cal-day other-month'; d.innerText=i; grid.appendChild(d); }
}

function showCalTooltip(e,dayHolidays){
  const tip=document.getElementById('calTooltip');
  let html='';
  dayHolidays.forEach(h=>{ html+='<div class="cal-tooltip-name">'+h.name+'</div>'+h.countries.map(c=>CAL_COUNTRIES[c]).join('<br>')+'<br>'; });
  tip.innerHTML=html; tip.style.display='block'; moveCalTooltip(e);
}

function moveCalTooltip(e){
  const tip=document.getElementById('calTooltip');
  tip.style.left=Math.min(e.clientX+12,window.innerWidth-240)+'px';
  tip.style.top=Math.max(10,e.clientY-tip.offsetHeight-4)+'px';
}

function hideCalTooltip(){ document.getElementById('calTooltip').style.display='none'; }

function calNavigate(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}

renderCalendar();

loadSong();
loadVotes();
loadLastSkip();
loadWeather();
loadCurrency();

setInterval(loadSong,10000);
setInterval(loadLastSkip,5000);
setInterval(loadWeather,600000);
setInterval(loadCurrency,600000);

</script>

</body>
</html>
